<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Offres</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="max-w-4xl mx-auto p-4">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold">Gestion des Offres</h1>
            <button id="btnAdd" class="bg-blue-600 text-white px-4 py-2 rounded">+ Ajouter</button>
        </div>

        <div id="formSection" class="hidden bg-white p-6 rounded  mb-6">
            <form id="form" class="flex flex-col gap-4">
                <input name="titre" required class="border p-2 rounded" type="text">
                <input name="description" class="border p-2 rounded" type="text">
                <input name="salaire"  class="border p-2 rounded" type="number" step="100">
                <select name="domaine_id" required class="border p-2 rounded" id="domaineSelect">

                </select>
                <div class="flex gap-2">
                    <button class="bg-blue-600 text-white px-4 py-2 rounded">Enregistrer</button>
                    <button type="button" id="btnCancel" class="bg-gray-500 text-white px-4 py-2 rounded">Annuler</button>
                </div>
            </form>
        </div>

        <table class="w-full bg-white rounded shadow overflow-hidden">
            <thead class="bg-gray-200">
                <tr>
                    <th class="p-3 text-left">Titre</th>
                    <th class="p-3 text-left">Domaine</th>
                    <th class="p-3 text-left">Salaire</th>
                </tr>
            </thead>
            <tbody id="tbody" class="divide-y"></tbody>
        </table>
    </div>
    <script src="index.js"></script>
</body>
</html>
